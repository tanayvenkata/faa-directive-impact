# Daily discovery sync (ROADMAP step 6). See DISCOVERY_SYNC.md.
#
# Restores the small discovery state from the `discovery-state` branch, runs
# one sync, commits the new state back (never raw bytes; REDISTRIBUTION.md),
# and deploys the freshness page to GitHub Pages. The page is deployed even
# when the sync fails, so the failure is visible; the run is then marked
# failed so it also shows in the Actions tab, and the alert job opens (or
# comments on) a GitHub issue. See DISCOVERY_SYNC.md, "Incidents".
name: Discovery sync

on:
  schedule:
    # Daily, after the Federal Register's 06:00 ET publication.
    - cron: "17 12 * * *"
  workflow_dispatch:
    inputs:
      accept_changed:
        description: >-
          Space-separated document numbers whose changed metadata you have
          investigated and accept (see DISCOVERY_SYNC.md). Leave empty normally.
        required: false
        default: ""
      reread:
        description: >-
          Space-separated IAE document numbers already in the corpus to acquire
          and classify again after a scope-reader fix. Leave empty normally.
        required: false
        default: ""

# No job inherits a permission; each job asks for only what it needs.
permissions: {}

concurrency:
  group: discovery-sync
  cancel-in-progress: false

env:
  STATE_BRANCH: discovery-state
  DISCOVERY_ROOT: data/discovery

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the state branch
    outputs:
      days_since_main_commit: ${{ steps.activity.outputs.days }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GitHub disables a public repository's scheduled workflows after 60
      # days without repository activity, and does not say whether this
      # workflow's own pushes to discovery-state count. The alert job warns
      # from the age of the checked-out commit (a scheduled run checks out
      # the latest commit on main).
      - name: Measure days since the last commit on main
        id: activity
        run: |
          set -euo pipefail
          last=$(git log -1 --format=%ct HEAD)
          days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "days=$days" >> "$GITHUB_OUTPUT"
          echo "Last commit on the checked-out branch: $days day(s) ago."

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install
        run: uv sync --locked

      - name: Restore discovery state
        run: |
          set -euo pipefail
          if git fetch --depth=1 origin "$STATE_BRANCH"; then
            git worktree add --detach state FETCH_HEAD
          else
            # First run: start an empty, unrelated history for the state.
            # switch --orphan starts with an empty index and working tree;
            # checkout --orphan keeps main's files staged, and git rm then
            # refuses to remove them (the first live run failed that way).
            git worktree add --detach state
            git -C state switch --orphan "$STATE_BRANCH"
          fi
          mkdir -p "$DISCOVERY_ROOT"
          if [ -d state/discovery ]; then
            cp -R state/discovery/. "$DISCOVERY_ROOT/"
          fi

      - name: Sync
        id: sync
        continue-on-error: true
        env:
          ACCEPT_CHANGED: ${{ inputs.accept_changed }}
          REREAD: ${{ inputs.reread }}
        run: |
          set -euo pipefail
          args=(--storage-root "$DISCOVERY_ROOT")
          if [ -n "${ACCEPT_CHANGED:-}" ]; then
            read -r -a accepted <<< "$ACCEPT_CHANGED"
            args+=(--accept-changed "${accepted[@]}")
          fi
          if [ -n "${REREAD:-}" ]; then
            read -r -a reread <<< "$REREAD"
            args+=(--reread "${reread[@]}")
          fi
          uv run faa-directive-impact discovery-sync "${args[@]}" | tee sync-attempt.json

      - name: Save discovery state (receipts, manifests, decisions, log; no raw bytes)
        if: always()
        run: |
          set -euo pipefail
          mkdir -p state/discovery
          # Append-only: nothing is deleted from the state branch.
          rsync -a --exclude 'raw/' --exclude '.staging/' --exclude '.active-*' \
            "$DISCOVERY_ROOT/" state/discovery/
          cd state
          git add -A discovery
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "discovery: state after run ${GITHUB_RUN_ID}"
          cd ..
          # Push from the main checkout, which holds checkout's credentials;
          # the worktree shares its object store.
          git push origin "$(git -C state rev-parse HEAD):refs/heads/$STATE_BRANCH"

      - name: Summarize the attempt
        if: always()
        run: |
          {
            echo "## Discovery sync"
            echo '```json'
            cat sync-attempt.json 2>/dev/null || echo '{"outcome": "no attempt record"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build freshness page
        if: always()
        run: uv run faa-directive-impact discovery-site --storage-root "$DISCOVERY_ROOT" --output site

      - name: Build fleet view
        if: always()
        run: uv run faa-directive-impact fleet-site --output site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: always()
        with:
          path: site

      - name: Fail the run when the sync did not succeed
        if: steps.sync.outcome != 'success'
        run: |
          echo "::error::Discovery sync did not succeed; see the freshness page and the attempt log."
          exit 1

  deploy:
    needs: sync
    # Deploy even when the sync failed, so the page shows the failure.
    if: always() && needs.sync.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Loud failure: open or update one issue when a run fails, close it after
  # a run succeeds, and warn before the 60-day inactivity limit. Uses only
  # the preinstalled gh CLI; no checkout, no third-party action.
  alert:
    needs: [sync, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update, or close the alert issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SYNC_RESULT: ${{ needs.sync.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          DAYS: ${{ needs.sync.outputs.days_since_main_commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          PAGES_URL: https://tanayvenkata.github.io/faa-directive-impact/
        run: |
          set -euo pipefail
          # The open issue with exactly this title, if any (list API, so a
          # new issue is found at once; search can lag).
          open_issue() {
            gh issue list --state open --limit 200 --json number,title \
              --jq "map(select(.title == \"$1\")) | first | .number // empty"
          }
          # Comment on the open issue with this title, or open one.
          raise() {
            number=$(open_issue "$1")
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "$2"
            else
              gh issue create --title "$1" --body "$2"
            fi
          }
          # Close the open issue with this title, if there is one.
          resolve() {
            number=$(open_issue "$1")
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "$2"
            fi
          }

          failing="Discovery sync failing"
          if [ "$SYNC_RESULT" = "success" ] && [ "$DEPLOY_RESULT" = "success" ]; then
            resolve "$failing" "Resolved: run $RUN_URL ($EVENT) succeeded."
          else
            raise "$failing" "The discovery sync run $RUN_URL ($EVENT) did not succeed: sync job \`$SYNC_RESULT\`, deploy job \`$DEPLOY_RESULT\`.

          The freshness page ($PAGES_URL) shows the failure and turns STALE 48 hours after the last success. Diagnose with DISCOVERY_SYNC.md, section Incidents. This issue closes itself after the next successful run."
          fi

          inactive="Scheduled sync at risk: no commit on main for 45 days"
          if [ -z "${DAYS:-}" ]; then
            echo "Days since the last commit on main are unknown (the sync job did not report them)."
          elif [ "$DAYS" -ge 45 ]; then
            raise "$inactive" "The last commit on main is $DAYS days old (run $RUN_URL).

          GitHub documents: \"In a public repository, scheduled workflows are automatically disabled when no repository activity has occurred in 60 days.\" It does not say whether this workflow's own pushes to discovery-state count, so commit to main before day 60. If the schedule is already disabled: Actions, Discovery sync, Enable workflow (or gh workflow enable discovery-sync.yml)."
          else
            resolve "$inactive" "Resolved: the last commit on main is $DAYS day(s) old."
          fi
