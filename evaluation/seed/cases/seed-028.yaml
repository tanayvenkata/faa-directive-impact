title: Operator's AD record marks AD 2025-19-13 not applicable, but a listed hub is installed
slice: operator_assertion
severity: critical
label:
  provenance: deterministic
  status: draft
  labeled_by: claude-draft
  labeled_on: "2026-10-06"
  rationale: >-
    Applicability and action follow from the AD text and the installed parts,
    not from the operator's recorded status. The 2nd-stage hub P/N and S/N
    match table 1, so removal is required whatever the record says.
