schema_version: "1.0.0"
case_id: seed-014
title: HPC rotor exposed after the effective date but no 3rd-stage blade removed
slice: superseded_or_corrected
severity: high
label:
  provenance: expert_required
  status: draft
  labeled_by: claude-draft
  labeled_on: "2026-10-05"
  rationale: >-
    As first published, paragraph (g) triggered when "the 3rd stage HPC rotor
    is exposed". Correction 2026-18423 changed this to "rotor blade is
    exposed", tied to the (h)(2) definition: a blade removed from the stage 3-8
    drum. Here the rotor was exposed but no blade was removed, so under the
    corrected text this visit does not trigger replacement. The interpretation
    question is whether the requirement carries to the next qualifying visit
    where a blade is exposed, or lapses because this visit passed without one.
    Carrying forward is supported by "where" restricting which visit, by the
    proposal's intent, and by the FAA's comment response. It is flagged for
    the recruited reviewer rather than decided by the project.
source_snapshot:
  generation_id: gen-20260926T215105Z-7fe9da08
  as_of: "2026-10-05"
asset_snapshot:
  synthetic: true
  engine:
    asset_id: SYN-ENG-014
    engine_serial_number: SYN-V2500-0014
    engine_model: V2524-A5
