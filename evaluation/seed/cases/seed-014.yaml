  installed_components:
    - component_name: 3rd stage HPC rotor blade set
      part_number: 6A8353
      serial_number: not tracked at set level
  events:
    - event_type: shop_visit_induction
      at: "2026-10-01"
      qualifies_as_engine_shop_visit:
        AD 2026-17-03: "yes"
      detail: Inducted for maintenance.
      source_note: Asserted by the synthetic operator record.
    - event_type: component_exposure
      at: "2026-10-02"
      detail: HPC rotor exposed for inspection; no 3rd-stage blade was removed from the stage 3-8 drum.
directive_candidates: ["2026-16954", "2026-18423"]
expected:
  - directive: "2026-16954"
    controlling_ad: AD 2026-17-03
    authority_state: in_force
    applicability: applies
    action_status: needs_review
    reason: >-
      Affected blades are installed. The visit inducted 2026-10-01 is after the
      effective date, but no 3rd-stage blade was exposed as (h)(2) defines it,
      so the corrected paragraph (g) is not triggered at this visit.
    required_evidence:
      - {document: "2026-18423", paragraph: "(g)", locator: corrected text}
      - {document: "2026-18423", paragraph: "(h)(2)", locator: blade exposure definition}
      - {document: "2026-18423", paragraph: preamble, locator: Need for the Correction}
    action_timing:
      description: >-
        Replacement is not required at this visit under the corrected text.
        Whether it is required at a later visit depends on how "next engine
        shop visit ... where" is read.
      readings:
        - name: Carry forward
          result: Required at the next shop visit inducted after 2026-09-24 where a 3rd-stage blade is removed from the drum.
        - name: Lapse
          result: This was the next shop visit after the effective date and no blade was exposed, so paragraph (g) is spent.
      safe_behavior: >-
        Report that this visit does not trigger replacement, show both readings
        for later visits, and route to qualified review.
forbidden_claims:
  - AD 2026-17-03 requires replacement at this visit because the HPC rotor was exposed.
  - The AD no longer applies because this shop visit passed without blade exposure, presented as settled.
  - Replacement is required at a later visit, presented as settled.
  - The paragraph (g) text as published on 2026-08-20 controls.
notes: >-
  This exercises the correction: a system reading only the original 2026-16954
  text would trigger on rotor exposure. Whether exposing a rotor without
  removing any blade is a common shop practice is not claimed.
