expected:
  - directive: "2026-16954"
    controlling_ad: AD 2026-17-03
    authority_state: in_force
    applicability: applies
    action_status: action_required
    reason: >-
      Affected blades are installed. The visit inducted 2026-10-01 is after the
      effective date, but no 3rd-stage blade was exposed as (h)(2) defines it,
      so the corrected paragraph (g) is not triggered at this visit.
    required_evidence:
      - {document: "2026-18423", paragraph: "(g)", locator: corrected text}
      - {document: "2026-18423", paragraph: "(h)(2)", locator: blade exposure definition}
      - {document: "2026-18423", paragraph: preamble, locator: Need for the Correction}
    action_timing:
