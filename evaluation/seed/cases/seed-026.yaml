schema_version: "1.1.0"
case_id: seed-026
title: Listed HPT 1st-stage hub that was repaired and re-inspected before the AD
slice: changed_product
severity: critical
label:
  provenance: deterministic
  status: draft
  labeled_by: claude-draft
  labeled_on: "2026-10-06"
  rationale: >-
    14 CFR 39.15 says an AD applies to each product it identifies "even if an
    individual product has been changed by modifying, altering, or repairing
    it in the area addressed by the airworthiness directive." AC 39-7D
    paragraph 9c says no alteration, modification, or repair removes a product
    from an AD's applicability. Paragraph (g) requires removal, not inspection,
    so a clean earlier inspection is not the required action "already done"
    under paragraph (f).
    Only an approved AMOC could change the action, and none is claimed.
