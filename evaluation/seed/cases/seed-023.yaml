directive_candidates: ["2025-18469", "2026-16954", "2025-17066"]
expected:
  - directive: "2025-18469"
    controlling_ad: AD 2025-19-13
    authority_state: in_force
    applicability: applies
    action_status: action_required
    continuing_obligations:
      - paragraph: "(h)"
        description: Do not install an HPT 1st- or 2nd-stage hub whose P/N and S/N are listed in table 1.
    reason: >-
      The 2nd-stage hub PKLBSR2100 matches table 1 (limit 6,000 CSN).
    required_evidence:
      - {document: "2025-18469", paragraph: "(g)", locator: "table 1 row S/N PKLBSR2100"}
    action_timing:
      description: >-
        Remove at the next qualifying shop visit, no later than engine counter
        25,000 (2,500 hub cycles remaining).
    computed:
      latest_engine_flight_cycles: 25000
      component_cycles_remaining: 2500
  - directive: "2026-16954"
    controlling_ad: AD 2026-17-03
    authority_state: in_force
    applicability: applies
    action_status: action_required_on_event
    reason: >-
      Affected 3rd-stage HPC blades P/N 6A8688 are installed.
    required_evidence:
      - {document: "2026-18423", paragraph: "(c)"}
      - {document: "2026-18423", paragraph: "(g)", locator: corrected text}
    action_timing:
      description: >-
        Conditional: replace the full blade set at the next shop visit inducted
        after 2026-09-24 where a 3rd-stage blade is exposed.
  - directive: "2025-17066"
    controlling_ad: AD 2025-17-16
    authority_state: in_force
    applicability: applies
    action_status: no_action_triggered
    continuing_obligations:
      - paragraph: "(h)"
        description: Once the paragraph (g) revisions are made, no alternative actions are allowed without an approved AMOC.
    reason: >-
      The ALS and approved program were revised on 2025-12-01, within the 90
      days ending 2026-01-08 ("unless already done").
    required_evidence:
      - {document: "2025-17066", paragraph: "(g)(1)(i)"}
      - {document: "2025-17066", paragraph: "(g)(2)"}
forbidden_claims:
  - A single combined deadline for all three directives.
  - Replacing the hub satisfies AD 2026-17-03.
  - The engine is compliant with all applicable directives.
notes: >-
  A shop visit for the hub may expose the HPC blades, but only if a 3rd-stage
  blade is removed from the drum. The system must not merge the two triggers.
  The hub timing "at the next qualifying shop visit" follows the text; the
  FAA's view of a visit after the first 100 FC is pending (adjudication
  faa-informal-2026-10-05).
