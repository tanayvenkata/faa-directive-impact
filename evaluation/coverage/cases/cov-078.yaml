schema_version: "1.1.0"
case_id: cov-078
title: Listed model whose 3rd-stage HPC blade part number is not recorded
slice: missing_state
severity: critical
label:
  provenance: deterministic
  status: draft
  labeled_by: claude-draft
  labeled_on: "2026-10-15"
  rationale: >-
    Paragraph (c) of AD 2026-17-03 has a part condition: a listed model with a
    3rd-stage HPC rotor blade P/N 6A8353 or 6A8688 installed. The model is
    listed, but the blade P/N is unknown, so applicability itself is unknown.
    Seeds 011 to 014 all have a known blade P/N; this fills the missing-fact
    outcome for the directive.
source_snapshot:
  generation_id: gen-20261015T175844Z-57440372
  as_of: "2026-10-15"
