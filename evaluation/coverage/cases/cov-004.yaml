case_id: cov-004
title: Operator records AD 2024-11-03 hubs replaced, and every compliance time has passed
slice: operator_assertion
severity: high
label:
  provenance: deterministic
  status: draft
  labeled_by: claude-draft
  labeled_on: "2026-10-15"
  rationale: >-
    Pre-registered Operator Records rule. AD 2024-11-03 applies by model.
    Every flight-cycle limit in Tables 1 to 3 (largest 3,800 FC from
    2024-06-26) has passed: 22,300 - 18,000 = 4,300 FC. The operator's record
    shows the hubs replaced at a 2024 shop visit with hubs not listed in the
    bulletin and no AUSI-inspected hub installed, so (g)(2) is not reached.
    The installed hubs do not contradict that record: they were installed on
    the recorded date and their S/Ns cannot be checked against the
    unavailable lists either way. A complied record for a passed deadline is
    reported as no action triggered, with the pre-registered note.
