schema_version: "1.1.0"
case_id: cov-011
title: Listed AD 2021-11-51 disk still installed years later, with a complied USI record
slice: operator_assertion
severity: high
label:
  provenance: deterministic
  status: draft
  labeled_by: claude-draft
  labeled_on: "2026-10-15"
  rationale: >-
    Pre-registered Operator Records rule. Paragraph (c)(2) names S/N
    PKLBSC8066, so the AD applies. Its action is a USI within 10 FC after the
    effective date (actual notice of the emergency AD, or 2021-07-19); that
    deadline passed long before 2026-10-15 under either clock. The operator
    records the USI accomplished and passed. This AD inspects and keeps: a
    disk that passed the USI is a part eligible for installation under (h)(1)
    (if listed in the bulletin appendix) or (h)(2) (if not), so a listed disk
    still installed does not contradict the complied record. The
    pre-registration's "a listed part still installed means the action is
    open" is read as applying to removal actions, not to an inspection whose
    passing part stays in service. The record is reported with the
    pre-registered note, not verified.
