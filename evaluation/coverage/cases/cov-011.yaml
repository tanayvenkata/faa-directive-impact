    controlling_ad: AD 2021-11-51
    authority_state: in_force
    applicability: applies
    action_status: no_action_triggered
    reason: >-
      V2533-A5 is listed and HPT 2nd-stage disk P/N 2A4802 S/N PKLBSC8066 is
      named in paragraph (c)(2). The (g)(2) USI was due within 10 FC after the
