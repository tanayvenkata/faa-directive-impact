title: HPT air seals and ring plate of other part numbers under AD 2017-14-07
slice: unaffected_part
severity: high
label:
  provenance: deterministic
  status: draft
  labeled_by: claude-draft
  labeled_on: "2026-10-15"
  rationale: >-
    Paragraph (c)(1) reaches an engine only through an installed P/N 2A4157,
    2A3423 or 2A3437 with a listed S/N. None of the three part numbers is
    installed, so the engine is outside the AD whatever the bulletins list.
    All ten models are named and every affected S/N is in an unavailable
    bulletin, so a different part number is the only way the public text can
    produce an engine with no action triggered.
