schema_version: "1.1.0"
case_id: cov-014
title: High-thrust engine under AD 2021-14-19, affected disk lists held in a P&W special instruction
slice: missing_incorporated_material
severity: critical
label:
  provenance: deterministic
  status: draft
  labeled_by: claude-draft
  labeled_on: "2026-10-15"
  rationale: >-
    AD 2021-14-19 defines its affected disks only by S/N lists in Tables 1 and
    2 of P&W SI No. 112F-21 and, for 2nd-stage disks, Table 1 of P&W SI No.
    114F-21; paragraph (c)(2) does not restrict SI No. 114F-21 by model.
    Neither SI is available. Both disks have only operated in this V2530-A5, a model named in
    (g)(1) and (g)(3), so the timing branch is settled if the S/N is listed:
    100 FC (1st-stage) and 385 FC (2nd-stage) after 2021-08-05.
