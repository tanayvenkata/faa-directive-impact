directive_candidates: ["2021-15486"]
expected:
  - directive: "2021-15486"
    controlling_ad: AD 2021-14-19
    authority_state: in_force
    applicability: unknown
    action_status: needs_review
    reason: >-
      Paragraph (c) covers 1st-stage disks P/N 2A5001 and 2nd-stage disks P/N
      2A4802 only when their S/N is listed in Tables 1 and 2 of P&W SI No.
      112F-21 or, for the 2nd-stage disk, Table 1 of P&W SI No. 114F-21; both
      are unavailable. Both part numbers are installed, so the
      engine can be neither placed in nor cleared from the AD.
    required_evidence:
      - {document: "2021-15486", paragraph: "(c)(1)"}
      - {document: "2021-15486", paragraph: "(c)(2)"}
      - {document: "2021-15486", paragraph: "(g)(1)"}
      - {document: "2021-15486", paragraph: "(g)(3)"}
    required_missing_facts:
      - P&W SI No. 112F-21 Accomplishment Instructions Tables 1 and 2 (unavailable incorporated material)
      - P&W SI No. 114F-21 Accomplishment Instructions Table 1 (unavailable incorporated material)
    action_timing:
      description: >-
        If the 1st-stage disk is listed: USI within 100 FC after 2021-08-05
        (engine counter 31,100), per (g)(1). If the 2nd-stage disk is listed in
        SI No. 112F-21 Table 2: USI within 385 FC after 2021-08-05 (counter
        31,385), per (g)(3). A 2nd-stage disk listed only in SI No. 114F-21 on
        this engine is within (c)(2), but (g)(5) names only disks that have
        operated solely in a V2531-E5. 60 FC have passed (31,060 - 31,000).
      safe_behavior: >-
        Name both unavailable special instructions and give both conditional
        limits; the 1st-stage limit is close.
forbidden_claims:
  - The engine is not affected because its disk S/Ns are not in the AD text.
  - The engine is affected because P/N 2A5001 is installed.
  - The 220 FC or 620 FC low-thrust limits apply to these disks.
  - The engine is compliant or noncompliant with AD 2021-14-19.
  - The engine is airworthy or safe to operate.
  - The engine is approved for return to service.
