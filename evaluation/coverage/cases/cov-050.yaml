title: Listed engine with a listed LPT stage-6 disk, no piece-part exposure since the AD took effect
slice: exact_match
severity: critical
label:
  provenance: deterministic
  status: draft
  labeled_by: claude-draft
  labeled_on: "2026-10-15"
  rationale: >-
    Paragraph (c) lists V2527-A5 engine S/N V12329, and the installed LPT
    stage-6 disk P/N 3A2996 S/N MAP04430 is listed in paragraph (g). The 2022
    LPT module removal did not completely disassemble the disk, so it was not a
    piece-part exposure under paragraph (h). The disk has been in this engine
    since before the readings, so its own cycles and the engine counter advance
    together.
