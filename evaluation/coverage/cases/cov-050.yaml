directive_candidates: ["2019-19412"]
expected:
  - directive: "2019-19412"
    controlling_ad: AD 2019-18-01
    authority_state: in_force
    applicability: applies
    action_status: action_required
    reason: >-
      Paragraph (c) lists V2527-A5 engine S/N V12329. The installed LPT stage 6
      disk P/N 3A2996 S/N MAP04430 is one of the serial numbers paragraph (g)
      requires removed from service. No piece-part exposure as paragraph (h)
      defines it (disk removed from the engine and completely disassembled)
      has occurred since 2019-10-15. The disk has 4,200 cycles since new, so
      5,000 - 4,200 = 800 cycles remain before the "not to exceed 5,000 cycles
      from new" limit; 58,900 + 800 = engine counter 59,700.
    required_evidence:
      - {document: "2019-19412", paragraph: "(c)", locator: engine serial number V12329}
      - {document: "2019-19412", paragraph: "(g)", locator: disk S/N MAP04430}
      - {document: "2019-19412", paragraph: "(h)", locator: piece-part exposure definition}
    action_timing:
      description: >-
        Remove the disk from service and replace it with a part eligible for
        installation at the next piece-part exposure, and in any case before
        it exceeds 5,000 cycles since new: at most 800 more cycles, engine
        counter 59,700. The 2022 module removal was not a piece-part exposure.
    computed:
      latest_engine_flight_cycles: 59700
      component_cycles_remaining: 800
forbidden_claims:
  - The engine is compliant or noncompliant with AD 2019-18-01.
  - The engine or the disk is safe or airworthy.
  - The engine is approved for return to service.
  - The disk was due for removal at the 2022 LPT module removal.
  - The disk may stay in service past 5,000 cycles since new.
  - The 5,000-cycle limit is counted in engine cycles since new.
notes: >-
  AD 2019-18-01 has no installation prohibition paragraph; none is implied
  here. "Not to exceed 5,000" is read as inclusive: the disk may reach but not
  pass 5,000 cycles since new.
