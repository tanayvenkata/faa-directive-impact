  status: draft
  labeled_by: claude-draft
  labeled_on: "2026-10-15"
  rationale: >-
    The CSN on the effective date picks the inspection band in (e)(1)(i)
    to (iv). The stage 1 hub's CSN is unknown, so no band and no limit can be
    stated for it even if it is listed. The stage 2 hub had 5,600 CSN on
    2016-10-07, band (e)(1)(i). Both hubs' listing is also unknown, because
    the S/N lists are in an unavailable bulletin.
