schema_version: "1.1.0"
case_id: cov-068
title: In-range A5 engine shortly after AD 2015-10-04 took effect, compliance group unknown
slice: missing_incorporated_material
severity: critical
label:
  provenance: deterministic
  status: draft
  labeled_by: claude-draft
  labeled_on: "2026-10-15"
  rationale: >-
    Paragraph (c)(3) covers V2524-A5 S/N V11500. Two actions are fixed by the
    AD text for every engine in paragraph (c): the paragraph (h) nut removal at
    the next piece-part exposure, and the paragraph (j) terminating action.
    The initial USI threshold (paragraph (e)(2) to (e)(5)) and the repeat
    interval (paragraph (f)) depend on the engine's group in IAE Alert NMSB
    V2500-ENG-72-A0615 Revision 6 paragraph 1.E (groups C and D by engine S/N,
    E and F by drum P/N), which is incorporated and not available, and on the
    drum P/N, which is not recorded. As in seed-008, the established action is
    action_required and the gaps are named.
source_snapshot:
  generation_id: gen-20261015T175844Z-57440372
  as_of: "2015-07-20"
