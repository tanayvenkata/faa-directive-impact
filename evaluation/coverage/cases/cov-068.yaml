  synthetic: true
  engine:
    asset_id: SYN-ENG-c068
    engine_serial_number: V11500
    engine_model: V2524-A5
    snapshot_at: "2015-07-20"
    engine_cycle_readings:
      - {at: "2015-07-01", engine_flight_cycles: 18300}
      - {at: "2015-07-20", engine_flight_cycles: 18340}
  installed_components:
    - component_name: HPC stage 3 to 8 drum
      part_number: unknown
      serial_number: SYN-DRUM-c068
      installed_at: "2012-11-05"
      cycles_since_new: 2000
    - component_name: HPC stage 3 to 8 drum attachment nuts
      part_number: AS44862
      serial_number: not serialized
  events: []
directive_candidates: ["2015-12068"]
expected:
  - directive: "2015-12068"
    controlling_ad: AD 2015-10-04
    authority_state: in_force
    applicability: applies
    action_status: action_required
    continuing_obligations:
      - paragraph: "(i)"
        description: Do not install silver-plated nuts, P/N AS44862 or AS64367, into any engine.
    reason: >-
      Paragraph (c)(3) covers V2524-A5 S/N V11500 (V10001 through V13190). The
      drum is attached with silver-plated nuts P/N AS44862, so paragraph (h)
      applies at the next piece-part exposure and paragraph (j) requires the
      terminating action within 9,450 cycles after 2015-07-01 (engine counter
      18,300 + 9,450 = 27,750) and not later than 2025-12-31. The initial USI
      threshold and repeat interval cannot be set without the engine's
      compliance group and the drum P/N.
    required_evidence:
      - {document: "2015-12068", paragraph: "(c)(3)"}
      - {document: "2015-12068", paragraph: "(e)"}
      - {document: "2015-12068", paragraph: "(h)(1)", locator: silver-plated nuts P/N AS44862 or AS64367}
      - {document: "2015-12068", paragraph: "(j)"}
      - {document: "2015-12068", paragraph: "(k)", locator: piece-part exposure definition}
    required_missing_facts:
      - IAE Alert NMSB V2500-ENG-72-A0615 Revision 6 paragraph 1.E compliance groups (unavailable incorporated material)
      - installed_components[HPC stage 3 to 8 drum].part_number
    action_timing:
      description: >-
        Install a drum that never operated with silver-plated nuts, with
        silver-free nuts, by engine counter 27,750 or 2025-12-31, whichever
        occurs first. At the next piece-part exposure of the drum, remove the
        AS44862 nuts, clean the drum, and do an FPI or ECI before returning
        any drum to service (paragraph (h)). The initial USI is due within 200
        cycles of the drum reaching its group threshold (3,750 to 12,500 drum
        cycles) or within 200 cycles after 2015-07-01, whichever occurs
        later; the group is unknown.
forbidden_claims:
  - The engine is compliant or noncompliant with AD 2015-10-04.
  - The engine is safe or airworthy.
  - The engine is approved for return to service.
  - The initial USI is due within 200 cycles after 2015-07-01, presented as settled.
  - No USI is required, presented as settled.
  - The engine is in a specific compliance group, presented as settled without the bulletin.
  - Repetitive USIs may replace the paragraph (j) terminating action.
notes: >-
  The drum has been in this engine since 2012, so engine cycles after
  2015-07-01 equal drum cycles; the case does not test whose cycles paragraph
  (j) counts. Paragraph (e) lets the paragraph (h)(3) inspections replace the
  USI for the initial inspection. Group A and B apply only to V2500-A1.
  Whether an in-range A5 engine can fall in no group at all (not in C or D,
  drum P/N not in E or F) cannot be checked without the bulletin.
