case_id: cov-030
title: HPT module disassembled with the stage 2 ring plate part number unrecorded under AD 2017-14-07
slice: missing_state
severity: critical
label:
  provenance: deterministic
  status: draft
  labeled_by: claude-draft
  labeled_on: "2026-10-15"
  rationale: >-
    The HPT module is disassembled with the stage 2 ring plate accessible,
    which is the (g)(2) trigger for a ring plate listed in NMSB
    V2500-ENG-72-0681 Revision 2. The ring plate's part number is not
    recorded, so (c)(1)(iii) cannot be checked; if it is P/N 2A3437, its S/N
    must then be checked against two unavailable bulletins, one leading to
    removal now (g)(2)(ii) and one to a cycle-limited removal (g)(1)(iii).
    The air seals carry part numbers the AD does not name.
