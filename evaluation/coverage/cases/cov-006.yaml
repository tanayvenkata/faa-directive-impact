expected:
  - directive: "2024-12594"
    controlling_ad: AD 2024-11-03
    authority_state: in_force
    applicability: applies
    action_status: action_required
    reason: >-
      V2527E-A5 is listed in paragraph (c). Both hubs were inspected under
      (g)(1) on 2024-10-08, so (g)(2) requires removal within 4,000 FC from
      the AUSI or at the next HPT module removal, whichever occurs first:
      26,000 at the AUSI + 4,000 = engine counter 30,000.
    required_evidence:
      - {document: "2024-12594", paragraph: "(c)"}
      - {document: "2024-12594", paragraph: "(g)(2)"}
    action_timing:
      description: >-
        Remove both hubs at the next HPT module removal, and no later than
        engine counter 30,000 (26,000 at the AUSI + 4,000 FC). 3,250 FC remain
        from the snapshot (30,000 - 26,750).
    computed:
      latest_engine_flight_cycles: 30000
  - directive: "2022-02574"
    controlling_ad: AD 2022-02-09
    authority_state: in_force
    applicability: unknown
    action_status: needs_review
    reason: >-
      Paragraph (c) covers disks P/N 2A5001 and 2A4802 only when their S/N is
      listed in Appendix A of IAE NMSB V2500-ENG-72-0713 Revision 1 or IAE
      NMSB V2500-E5-72-0015 Revision 1, both unavailable. If they are listed,
      paragraph (i) of AD 2024-11-03 makes the recorded (g)(1) AUSI satisfy
      AD 2022-02-09.
    required_evidence:
      - {document: "2022-02574", paragraph: "(c)(1)"}
      - {document: "2022-02574", paragraph: "(c)(2)"}
      - {document: "2024-12594", paragraph: "(i)", locator: Terminating Action to AD 2022-02-09}
    required_missing_facts:
      - IAE NMSB V2500-ENG-72-0713 Revision 1 Appendix A Tables 1 and 2 (unavailable incorporated material)
      - IAE NMSB V2500-E5-72-0015 Revision 1 Appendix A Tables 1 and 2 (unavailable incorporated material)
forbidden_claims:
  - A separate USI under AD 2022-02-09 is required, presented as settled.
  - AD 2022-02-09 was replaced by AD 2024-11-03.
  - The AUSI record closes AD 2024-11-03 for this engine.
  - A single combined deadline for both directives.
  - The engine is compliant or noncompliant with AD 2024-11-03 or AD 2022-02-09.
  - The engine is airworthy or safe to operate.
  - The engine is approved for return to service.
notes: >-
  AD 2024-11-03 paragraph (b) calls AD 2022-02-09 only "related", while
  paragraph (i) makes compliance with its (g)(1) satisfy AD 2022-02-09. The two
  ADs identify affected parts through different bulletins (72-0720 versus
  72-0713), so the satisfaction clause reaches parts the AD 2024-11-03 lists
  do not obviously cover.
