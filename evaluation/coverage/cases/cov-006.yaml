case_id: cov-006
title: AD 2024-11-03 AUSI accomplished while the AD 2022-02-09 record is still open
slice: multiple_directives
severity: critical
label:
  provenance: deterministic
  status: draft
  labeled_by: claude-draft
  labeled_on: "2026-10-15"
  rationale: >-
    Two units. AD 2024-11-03: both hubs had the (g)(1) AUSI on 2024-10-08 at
    counter 26,000, so (g)(2) requires removal within 4,000 FC (counter
    30,000) or at the next HPT module removal, whichever first. AD 2022-02-09:
    applicability turns on S/N lists in Appendix A of IAE NMSB
    V2500-ENG-72-0713 Revision 1 or IAE NMSB V2500-E5-72-0015 Revision 1
    (paragraph (c) names both without restricting either by model), which
    are unavailable, so it stays unknown. Paragraph (i) of AD 2024-11-03
    says compliance with its (g)(1) satisfies AD 2022-02-09, so if the disks
    are listed, the recorded AUSI already answers AD 2022-02-09 and the open
    record entry does not by itself mean a new USI is required. The open
    record is not named as a missing fact because applicability, not the
    record, is what is unknown.
