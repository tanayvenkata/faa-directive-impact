schema_version: "1.1.0"
case_id: cov-031
title: AD 2021-11-51 2nd-stage disk serial printed without a separating comma
slice: part_identity
severity: critical
label:
  provenance: deterministic
  status: draft
  labeled_by: claude-draft
  labeled_on: "2026-10-15"
  rationale: >-
    Paragraph (c)(2) prints "PKLBR88708 PKLBR89452" with no comma between the
    two S/Ns. Read as words, both are listed, so the installed 2nd-stage disk
    P/N 2A4802 S/N PKLBR89452 makes the AD apply to this V2527M-A5. The (g)(2)
    USI is due within 10 FC after the effective date, which is the operator's
    actual notice of Emergency AD 2021-11-51 or 2021-07-19 without it, and it
    acts on disks listed in table 2 to paragraph (g)(2), an untranscribed
    image. As in seed-022, the deadline and the table are open facts.
