schema_version: "1.1.0"
case_id: cov-008
title: HPT 2nd-stage disk part number missing from the record under AD 2022-02-09
slice: missing_state
severity: critical
label:
  provenance: deterministic
  status: draft
  labeled_by: claude-draft
  labeled_on: "2026-10-15"
  rationale: >-
    The 1st-stage disk is of a part number AD 2022-02-09 does not name, so
    only the 2nd-stage disk can bring the engine into paragraph (c)(2). Its
    part number is not recorded. If it is P/N 2A4802, applicability then also
    depends on Appendix A Table 2 of IAE NMSB V2500-ENG-72-0713 Revision 1
    or of IAE NMSB V2500-E5-72-0015 Revision 1; paragraph (c)(2) names both
    without restricting either by model, and both are unavailable.
source_snapshot:
  generation_id: gen-20261015T175844Z-57440372
  as_of: "2022-04-01"
asset_snapshot:
  synthetic: true
  engine:
    asset_id: SYN-ENG-c008
    engine_serial_number: SYN-V2500-c008
    engine_model: V2522-A5
    snapshot_at: "2022-04-01"
  installed_components:
    - component_name: HPT 1st-stage disk
      part_number: SYN-PN-HPT1-c008
      serial_number: SYN-DISK1-c008
    - component_name: HPT 2nd-stage disk
      part_number: unknown
      serial_number: SYN-DISK2-c008
  events: []
directive_candidates: ["2022-02574"]
expected:
  - directive: "2022-02574"
    controlling_ad: AD 2022-02-09
    authority_state: in_force
    applicability: unknown
    action_status: needs_review
    reason: >-
      The 1st-stage disk P/N is not 2A5001, so (c)(1) cannot apply. The
      2nd-stage disk P/N is unknown, so (c)(2) cannot be checked; if it is
      2A4802, its S/N must then be checked against Appendix A Table 2 of IAE
      NMSB V2500-ENG-72-0713 Revision 1 or IAE NMSB V2500-E5-72-0015 Revision
      1, both unavailable.
    required_evidence:
      - {document: "2022-02574", paragraph: "(c)(1)"}
      - {document: "2022-02574", paragraph: "(c)(2)"}
      - {document: "2022-02574", paragraph: "(g)(4)"}
    required_missing_facts:
      - installed_components[HPT 2nd-stage disk].part_number
      - IAE NMSB V2500-ENG-72-0713 Revision 1 Appendix A Table 2 (unavailable incorporated material)
      - IAE NMSB V2500-E5-72-0015 Revision 1 Appendix A Table 2 (unavailable incorporated material)
    action_timing:
      description: >-
        If the 2nd-stage disk is P/N 2A4802 with a listed S/N, paragraph (g)(4)
        requires a USI within the Figure 2 (or, if it has operated in a
        high-thrust model, Figure 1) compliance time or within 10 FC after
        2022-03-15, whichever occurs later. Both figures are images not in the
        text. Paragraph (g)(4) acts only on S/Ns in the 72-0713 table; a disk
        listed only in the E5-72-0015 table on this V2522-A5 would be within
        (c)(2) with no (g) paragraph naming its compliance time.
      safe_behavior: >-
        Name the missing part number first; give the conditional timing
        without stating figure values.
forbidden_claims:
  - AD 2022-02-09 does not apply to this engine.
  - The 2nd-stage disk is P/N 2A4802, presented as settled.
  - Figure 1 or Figure 2 compliance values stated as numbers.
  - The engine is compliant or noncompliant with AD 2022-02-09.
  - The engine is airworthy or safe to operate.
  - The engine is approved for return to service.
notes: >-
  Figures 1 and 2 of AD 2022-02-09 are the images ER08FE22.048 and
  ER08FE22.049; the E3 decision keeps image-only tables out of rules until a
  double read verifies them. Across the AD 2022-02-09 cases, no determinate
  action-required outcome can be written from the public text: every action
  is keyed to S/N lists in unavailable bulletins, and its compliance times sit
  in image-only figures.
