schema_version: "1.1.0"
case_id: cov-015
title: V2531-E5 under AD 2021-14-19, with two special instructions and no 1st-stage E5 timing
slice: missing_incorporated_material
severity: critical
label:
  provenance: deterministic
  status: draft
  labeled_by: claude-draft
  labeled_on: "2026-10-15"
  rationale: >-
    V2531-E5 is listed in paragraph (c). Its 2nd-stage disk is affected if
    its S/N is in Table 2 of P&W SI No. 112F-21 or Table 1 of P&W SI No.
    114F-21; its 1st-stage disk if in Table 1 of SI No. 112F-21. Neither SI is
    available. If the 2nd-stage disk is in SI No. 114F-21, (g)(5) gives 385 FC.
    A 1st-stage disk that has operated only in a V2531-E5 fits none of the
    history categories of (g)(1) and (g)(2), so its compliance time would also
    need review. Every branch ends at review, so the label is deterministic.
