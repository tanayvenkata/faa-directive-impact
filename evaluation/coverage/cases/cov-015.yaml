directive_candidates: ["2021-15486"]
expected:
  - directive: "2021-15486"
    controlling_ad: AD 2021-14-19
    authority_state: in_force
    applicability: unknown
    action_status: needs_review
    reason: >-
      V2531-E5 is listed in paragraph (c). The 1st-stage disk is affected only
      if its S/N is in Table 1 of P&W SI No. 112F-21, and the 2nd-stage disk
      only if its S/N is in Table 2 of SI No. 112F-21 or Table 1 of SI No.
      114F-21. Neither SI is available.
    required_evidence:
      - {document: "2021-15486", paragraph: "(c)(1)"}
      - {document: "2021-15486", paragraph: "(c)(2)"}
      - {document: "2021-15486", paragraph: "(g)(5)"}
    required_missing_facts:
      - P&W SI No. 112F-21 Accomplishment Instructions Tables 1 and 2 (unavailable incorporated material)
      - P&W SI No. 114F-21 Accomplishment Instructions Table 1 (unavailable incorporated material)
    action_timing:
      description: >-
        If the 2nd-stage disk is listed in SI No. 114F-21: USI within 385 FC
        after 2021-08-05 (engine counter 7,585), per (g)(5). If the 1st-stage
        disk is listed in SI No. 112F-21 Table 1, paragraphs (g)(1) and (g)(2)
        name only non-E5 operating histories, so no compliance time in the
        text fits a disk that has operated only in a V2531-E5.
      safe_behavior: >-
        Name both unavailable SIs, state the (g)(5) limit conditionally, and
        flag the 1st-stage timing gap for review rather than borrowing a
        limit from (g)(1) or (g)(2).
forbidden_claims:
  - AD 2021-14-19 does not apply to V2531-E5 1st-stage disks.
  - The 1st-stage disk must be inspected within 100 FC, presented as settled.
  - Only P&W SI No. 114F-21 needs to be checked for this engine.
  - The engine is compliant or noncompliant with AD 2021-14-19.
  - The engine is airworthy or safe to operate.
  - The engine is approved for return to service.
notes: >-
  The preamble says SI No. 112F-21 identifies disks installed on the nine
  non-E5 models and SI No. 114F-21 identifies 2nd-stage disks on V2531-E5,
  while paragraph (c)(1) still lists V2531-E5 among the models.
