schema_version: "1.1.0"
case_id: cov-018
title: Disk named in AD 2020-07-51 still installed although the operator records it complied
slice: operator_assertion
severity: critical
label:
  provenance: deterministic
  status: draft
  labeled_by: claude-draft
  labeled_on: "2026-10-15"
  rationale: >-
    Paragraph (c) names S/N PKLBR38661, so the AD applies. The required
    action is removal from service. Whichever paragraph governs, removal
    follows: (g)(1) within 5 FC after the effective date if the engine and
    disk pair is in Table 1, otherwise (g)(2), whose records review names
    PKLBR38661 and requires removal within 5 FC after that determination. The
    operator's "complied" record says no affected disk is installed, which
    the installed-part facts contradict. Under the pre-registered rule a
    listed part still installed means the removal is open whatever the record
    says. Table 1 is an untranscribed image, but no reading of it changes the
    outcome.
source_snapshot:
  generation_id: gen-20261015T175844Z-57440372
  as_of: "2026-10-15"
asset_snapshot:
  synthetic: true
  engine:
    asset_id: SYN-ENG-c018
    engine_serial_number: SYN-V2500-c018
    engine_model: V2533-A5
    snapshot_at: "2026-10-15"
  installed_components:
    - component_name: HPT 1st-stage disk
      part_number: 2A5001
      serial_number: PKLBR38661
      installed_at: "2019-11-02"
    - component_name: HPT 2nd-stage disk
      part_number: 2A4802
      serial_number: SYN-DISK2-c018
  events: []
  ad_records:
    - ad: AD 2020-07-51
      recorded_status: complied
      detail: Records review completed 2020-04-30; no affected HPT 1st-stage disk installed.
directive_candidates: ["2020-07627"]
expected:
  - directive: "2020-07627"
    controlling_ad: AD 2020-07-51
    authority_state: in_force
    applicability: applies
    action_status: action_required
    reason: >-
      V2533-A5 is listed and HPT 1st-stage disk P/N 2A5001 S/N PKLBR38661 is
      named in paragraph (c). Paragraph (g)(1) or (g)(2) requires its removal
      from service; (g)(2) names PKLBR38661 in its records review. The
      operator's "complied" record contradicts the installed disk; flag it for
      records review.
    required_evidence:
      - {document: "2020-07627", paragraph: "(c)"}
      - {document: "2020-07627", paragraph: "(g)(1)", locator: table 1 to paragraph (g)(1) (image ER13AP20.000)}
      - {document: "2020-07627", paragraph: "(g)(2)"}
    action_timing:
      description: >-
        Remove the disk from service. The AD allowed 5 FC after its effective
        date (2020-04-28, or earlier actual notice of the emergency AD) under
        (g)(1), or 5 FC after a records review due within 3 calendar days of
        the effective date under (g)(2). Either compliance time ended in 2020,
        so the removal is open now and needs immediate attention.
forbidden_claims:
  - No action is required because the operator's record shows compliance.
  - The operator's AD record is correct.
  - The removal is overdue, or the engine is noncompliant.
  - The engine is compliant with AD 2020-07-51.
  - The engine is airworthy or safe to operate.
  - The engine is approved for return to service.
notes: >-
  PKLBR38661 is a real S/N published in the AD, placed on a synthetic engine;
  a real disk on a synthetic engine is itself a records conflict a clerk would
  flag.
