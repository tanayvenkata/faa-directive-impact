directive_candidates: ["2019-17403"]
expected:
  - directive: "2019-17403"
    controlling_ad: AD 2019-16-01
    authority_state: in_force
    applicability: applies
    action_status: action_required
    reason: >-
      V2528-D5 is listed in paragraph (c). No TEC mount stiffener rail
      inspection is recorded. The 2020-01-10 induction separated no major
      mating case flanges, so under paragraph (j) it was not an engine shop
      visit and did not trigger paragraph (g)(1). The limit is 4,000 FC after
      the 2019-09-19 effective date: 20,000 + 4,000 = engine counter 24,000.
    required_evidence:
      - {document: "2019-17403", paragraph: "(c)"}
      - {document: "2019-17403", paragraph: "(g)(1)"}
      - {document: "2019-17403", paragraph: "(j)", locator: engine shop visit definition}
    action_timing:
      description: >-
        Perform the ECI and high sensitivity FPI of the TEC front and rear
        mount stiffener rails per paragraphs (g)(1)(i) to (iv) at the next
        engine shop visit (one with major case flange separation), and not
        later than engine counter 24,000 (2,800 FC after the snapshot). If no
        crack is found, repeat within every 2,000 FC since the last inspection
        under paragraph (g)(2).
    computed:
      latest_engine_flight_cycles: 24000
forbidden_claims:
  - The engine is compliant or noncompliant with AD 2019-16-01.
  - The engine is safe or airworthy.
  - The engine is approved for return to service.
  - The inspection was required at the 2020-01-10 induction.
  - The 2020-01-10 induction counts as the engine shop visit for AD 2019-16-01.
  - The inspection is due 4,000 FC after the 2020-01-10 induction.
notes: >-
  "Not later than 4,000 flight cycles after the effective date" is read as
  inclusive. The inspection steps themselves live in IAE NMSB
  V2500-ENG-72-0694 Revision 2, which is incorporated by reference.
