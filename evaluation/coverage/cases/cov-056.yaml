schema_version: "1.1.0"
case_id: cov-056
title: D5 engine before the 4,000-cycle limit, after an induction without flange separation
slice: shop_visit_trigger
severity: critical
label:
  provenance: deterministic
  status: draft
  labeled_by: claude-draft
  labeled_on: "2026-10-15"
  rationale: >-
    Paragraph (c) covers all V2528-D5 engines. Paragraph (j) counts as an
    engine shop visit only an induction for maintenance involving separation of
    pairs of major mating engine case flanges. The January 2020 induction
    separated none, so it was not the "next engine shop visit" of paragraph
    (g)(1). The 4,000-FC limit from the effective date still runs.
