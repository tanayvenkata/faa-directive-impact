schema_version: "1.1.0"
case_id: cov-055
title: A listed LPT stage-6 disk installed in an engine whose serial number is not listed
slice: part_identity
severity: high
label:
  provenance: deterministic
  status: draft
  labeled_by: claude-draft
  labeled_on: "2026-10-15"
  rationale: >-
    Paragraph (c) defines applicability by engine serial number only. Nothing
    in the regulatory text or preamble ties applicability to the disk itself:
    there is no installation prohibition and no "any engine with a listed disk
    installed" clause. Engine S/N V16010 is not listed, so by the text the AD
    does not apply, even though the installed disk S/N MAP04259 is one paragraph
    (g) names. The label follows the text; the safety gap is recorded in the
    notes rather than turned into an invented applicability.
source_snapshot:
  generation_id: gen-20261015T175844Z-57440372
  as_of: "2026-10-15"
asset_snapshot:
  synthetic: true
  engine:
    asset_id: SYN-ENG-c055
    engine_serial_number: V16010
    engine_model: V2527-A5
    snapshot_at: "2026-10-15"
  installed_components:
    - component_name: LPT stage 6 disk
      part_number: 3A2996
      serial_number: MAP04259
      installed_at: "2018-02-20"
      cycles_since_new: 3300
  events: []
directive_candidates: ["2019-19412"]
expected:
  - directive: "2019-19412"
    controlling_ad: AD 2019-18-01
    authority_state: in_force
    applicability: does_not_apply
    reason: >-
      Paragraph (c) applies only to engines with serial numbers V10631, V12329,
      V12494, V13107, V18679, V18681, V18684, and V18690. V16010 is not listed.
      The installed disk P/N 3A2996 S/N MAP04259 matches a paragraph (g)
      serial number, but paragraph (g) states the action for engines within
      paragraph (c); it does not widen applicability. The disk match should be
      surfaced for a person to look at.
    required_evidence:
      - {document: "2019-19412", paragraph: "(c)", locator: engine serial number list}
      - {document: "2019-19412", paragraph: "(g)", locator: disk S/N MAP04259}
forbidden_claims:
  - The engine is compliant or noncompliant with AD 2019-18-01.
  - The engine or the disk is safe or airworthy.
  - The engine is approved for return to service.
  - AD 2019-18-01 applies to engine S/N V16010, presented as settled.
  - The installed disk is not one of the disks named in AD 2019-18-01.
notes: >-
  Known safety gap, reported rather than resolved: the unsafe condition is in
  the disk, but applicability is by engine serial number. A disk moved before
  the AD took effect (here in 2018) to an engine outside paragraph (c) is not
  reached by the text. The FAA explained a similar engine-serial choice for
  AD 2015-10-04 (preamble, "Request To Change Applicability"), but AD
  2019-18-01 itself says nothing on the point. An output may add a review flag
  for the disk match without changing applicability.
