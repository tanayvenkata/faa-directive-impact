expected:
  - directive: "2020-07627"
    controlling_ad: AD 2020-07-51
    authority_state: in_force
    applicability: applies
    action_status: needs_review
    reason: >-
      V2527-A5 is listed and HPT 1st-stage disk P/N 2A5001 S/N PKLBR73862 is
      named in paragraph (c). Removal under (g)(1) depends on whether this
      engine and disk pair is in Table 1, an image not in the text; the
      (g)(2) records review does not name PKLBR73862.
    required_evidence:
      - {document: "2020-07627", paragraph: "(a)"}
      - {document: "2020-07627", paragraph: "(c)"}
      - {document: "2020-07627", paragraph: "(g)(1)", locator: table 1 to paragraph (g)(1) (image ER13AP20.000)}
      - {document: "2020-07627", paragraph: "(g)(2)"}
    required_missing_facts:
      - table 1 to paragraph (g)(1) content (image ER13AP20.000; not transcribed)
      - operator date of actual notice of Emergency AD 2020-07-51
    action_timing:
      description: >-
        If the pair is in Table 1: remove the disk within 5 FC after the
        effective date that applies to this operator, either actual notice of
        Emergency AD 2020-07-51 (issued 2020-03-21) or 2020-04-28 (engine
        counter 14,005). 4 FC have passed since 2020-04-28.
      safe_behavior: >-
        Treat the disk as a removal candidate within 1 FC of the 2020-04-28
        clock, name the image and the notice date, and route to review now.
forbidden_claims:
  - AD 2020-07-51 does not apply to this engine.
  - No removal is required because the (g)(2) records review does not name PKLBR73862, presented as settled.
  - Table 1 contents stated without the image.
  - The engine is compliant or noncompliant with AD 2020-07-51.
  - The engine is airworthy or safe to operate.
  - The engine is approved for return to service.
notes: >-
  PKLBR73862 is a real S/N published in the AD, placed on a synthetic engine.
  E3's image count covered only the seed corpus and does not list
  ER13AP20.000; the same fail-closed treatment is assumed for it.
