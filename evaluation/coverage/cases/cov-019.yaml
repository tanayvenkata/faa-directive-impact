schema_version: "1.1.0"
case_id: cov-019
title: AD 2020-07-51 disk whose removal depends on an image-only engine and disk table
slice: missing_incorporated_material
severity: critical
label:
  provenance: deterministic
  status: draft
  labeled_by: claude-draft
  labeled_on: "2026-10-15"
  rationale: >-
    Paragraph (c) names S/N PKLBR73862, so the AD applies. Paragraph (g)(1)
    requires removal within 5 FC for engines whose engine S/N and disk S/N
    pair is in Table 1, which is the image ER13AP20.000 and not in the text.
    Paragraph (g)(2) covers all other affected engines but its records review
    names only PKLBR37442, PKLBR38661 and PKLBR40207. If this engine's pair is
    not in Table 1, the text gives no removal for PKLBR73862. Whether a
    removal is required therefore depends on the image, and the clock start
    also depends on the operator's actual notice of the emergency AD.
