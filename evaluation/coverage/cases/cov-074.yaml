expected:
  - directive: "2025-17066"
    controlling_ad: AD 2025-17-16
    authority_state: in_force
    applicability: applies
    action_status: needs_review
    continuing_obligations:
      - paragraph: "(h)"
        description: Once the paragraph (g) revisions are made, no alternative actions are allowed without an approved AMOC.
    reason: >-
      V2528-D5 is listed in paragraph (c). Paragraph (g)(1)(ii) required
      revising paragraph B.1 of the ALS in the V2500-D5 TLM (P/N 2A4417, TASK
      05-10-00-990-000) and, for this air carrier, paragraph (g)(2) required
      revising the approved maintenance or inspection program, both within 90
      days after 2025-10-10 (by 2026-01-08). Neither an AD record nor the
      program's revision state is supplied, so whether the revisions were made
      cannot be determined.
    required_evidence:
