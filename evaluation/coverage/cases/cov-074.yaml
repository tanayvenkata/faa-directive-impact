case_id: cov-074
title: D5 air-carrier engine after the ALS revision deadline with no AD record or program state
slice: operator_assertion
severity: critical
label:
  provenance: deterministic
  status: draft
  labeled_by: claude-draft
  labeled_on: "2026-10-15"
  rationale: >-
    AD 2025-17-16 applies to every listed model, V2528-D5 included. Both
    paragraph (g) revisions were due within 90 days after 2025-10-10, that is
    by 2026-01-08, which has passed. No AD record and no maintenance program
    revision is supplied, so the pre-registered Operator Records rule gives
    needs_review naming ad_records[AD 2025-17-16].
