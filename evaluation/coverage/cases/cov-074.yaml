      - {document: "2025-17066", paragraph: "(g)(1)(ii)", locator: "V2500-D5 TLM P/N 2A4417, TASK 05-10-00-990-000"}
      - {document: "2025-17066", paragraph: "(g)(2)"}
    required_missing_facts:
      - ad_records[AD 2025-17-16]
forbidden_claims:
  - The engine is compliant or noncompliant with AD 2025-17-16.
  - The engine is safe or airworthy.
  - The engine is approved for return to service.
  - The ALS revision is overdue.
  - The V2500-A5 Time Limits Manual (P/N 2A4408) applies to this engine.
  - AD 2025-17-16 requires inspecting the HPT hubs by 2026-01-08.
