  - The applicability of AD 2021-14-19 depends on the SI lists for this engine.
  - The engine is compliant or noncompliant with AD 2021-14-19.
  - The engine is airworthy or safe to operate.
  - The engine is approved for return to service.
notes: >-
  The SYN- part numbers stand for HPT disk part numbers other than those the AD
  names. No claim is made about which other part numbers exist in the V2500
  parts catalog.
