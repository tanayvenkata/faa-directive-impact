  installed_components:
    - component_name: HPT 1st-stage disk
      part_number: SYN-PN-HPT1-c016
      serial_number: SYN-DISK1-c016
    - component_name: HPT 2nd-stage disk
      part_number: SYN-PN-HPT2-c016
      serial_number: SYN-DISK2-c016
  events: []
directive_candidates: ["2021-15486"]
expected:
  - directive: "2021-15486"
    controlling_ad: AD 2021-14-19
    authority_state: in_force
    applicability: does_not_apply
    reason: >-
      Paragraph (c) requires an installed HPT 1st-stage disk P/N 2A5001 or HPT
      2nd-stage disk P/N 2A4802 with a listed S/N. The installed disks are P/N
      SYN-PN-HPT1-c016 and SYN-PN-HPT2-c016.
    required_evidence:
      - {document: "2021-15486", paragraph: "(c)(1)"}
      - {document: "2021-15486", paragraph: "(c)(2)"}
forbidden_claims:
