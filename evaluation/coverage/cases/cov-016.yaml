schema_version: "1.1.0"
case_id: cov-016
title: HPT disks of other part numbers under AD 2021-14-19
slice: unaffected_part
severity: high
label:
  provenance: deterministic
  status: draft
  labeled_by: claude-draft
  labeled_on: "2026-10-15"
  rationale: >-
    Paragraph (c) of AD 2021-14-19 requires an installed HPT 1st-stage disk
    P/N 2A5001 or HPT 2nd-stage disk P/N 2A4802 with a listed S/N. Neither part
    number is installed, so the engine is outside the AD whatever the SI lists
    contain. All ten V2500-A5/D5/E5 models are listed, and every affected S/N
    is in an unavailable SI, so a different part number is the only way the
    public text can produce an engine with no action triggered.
