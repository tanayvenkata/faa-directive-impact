schema_version: "1.1.0"
case_id: cov-060
title: Recurring TEC inspection record with the next repeat computable
slice: operator_assertion
severity: high
label:
  provenance: deterministic
  status: draft
  labeled_by: claude-draft
  labeled_on: "2026-10-15"
  rationale: >-
    The pre-registered Operator Records rule turns a complied or recurring
    record into no_action_triggered only for an action whose deadline has
    passed. That covers the paragraph (g)(1) initial inspection here. The
    next paragraph (g)(2) repeat is a future deadline computable from the
    recorded last inspection, so it is reported as a required action with its
    limit, not cleared by the record.
