  rationale: >-
    Unlike its sister ADs, AD 2021-11-51 prints its affected S/Ns in paragraph
    (c) itself: seven 1st-stage disk S/Ns and eight 2nd-stage disk S/Ns. Both
    installed disks carry the listed part numbers but S/Ns that are not in
    either list, so the engine is outside the AD. The AD has no installation
    prohibition.
