schema_version: "1.1.0"
case_id: cov-069
title: In-range D5 engine with a No. 4 bearing internal scavenge tube past 10,000 cycles
slice: shop_visit_trigger
severity: critical
label:
  provenance: deterministic
  status: draft
  labeled_by: claude-draft
  labeled_on: "2026-10-15"
  rationale: >-
    Paragraph (c) needs all three: a V2525-D5 or V2528-D5 engine with S/N
    V20001 through V20285, internal scavenge tube P/N 2A2074-01 installed, and
    external scavenge tube P/N 6A5254 installed. All hold. The internal tube
    has 12,400 cycles since new, past the 10,000-cycle threshold, so paragraph
    (f) requires its replacement at each combustor module-level exposure. The
    AD sets no cycle or calendar deadline, only the exposure event.
