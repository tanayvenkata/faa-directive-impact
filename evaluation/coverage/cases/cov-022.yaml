schema_version: "1.1.0"
case_id: cov-022
title: AD 2016-18-10 hubs in a CSN band, but the affected serial lists are in an unavailable bulletin
slice: missing_incorporated_material
severity: critical
label:
  provenance: deterministic
  status: draft
  labeled_by: claude-draft
  labeled_on: "2026-10-15"
  rationale: >-
    AD 2016-18-10 applies only to hubs whose S/Ns are in Appendix A Tables 1
    and 2 of IAE NMSB V2500-ENG-72-0661 Revision 2, which is unavailable. Both
    hubs had 9,200 CSN on 2016-10-07, band (e)(1)(ii). If listed, inspection
    is due at the next shop visit, or within 6,000 cycles from 2016-10-07, or
    before accumulating 15,000 CSN, whichever comes first. 15,000 - 9,200 =
    5,800, which is less than 6,000, so the CSN limit governs: the
    inspection must precede the 15,000th cycle (that is, by 14,999 CSN).
