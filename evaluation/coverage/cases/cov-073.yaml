schema_version: "1.1.0"
case_id: cov-073
title: In-range engine whose internal scavenge tube is below 10,000 cycles
slice: cycle_limit
severity: high
label:
  provenance: engineer_interpreted
  status: draft
  labeled_by: claude-draft
  labeled_on: "2026-10-15"
  rationale: >-
    The AD applies (paragraph (c) is met). Paragraph (f) requires replacement
    only at a combustor module-level exposure "after" the tube has accumulated
    10,000 cycles since new. At 6,000 cycles, an exposure today would require
    nothing, so the label is no_action_triggered, with paragraphs (f) and (g)
    as continuing obligations, rather than action_required_on_event. The
    labeling rule used: an action whose trigger also needs a count not yet
    reached is not on_event until the count is reached. This choice is
    Claude's stand-in judgment and is reported as an ambiguity.
