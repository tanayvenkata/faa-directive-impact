schema_version: "1.1.0"
case_id: cov-001
title: AD 2024-11-03 hubs installed, but the affected serial lists are in an unavailable bulletin
slice: missing_incorporated_material
severity: critical
label:
  provenance: deterministic
  status: draft
  labeled_by: claude-draft
  labeled_on: "2026-10-15"
  rationale: >-
    Paragraph (c) is model-only, so AD 2024-11-03 applies to every V2527-A5.
    Every required action in (g)(1), (g)(4) and (g)(5) is keyed to hub S/Ns
    listed in tables of IAE AG NMSB V2500-ENG-72-0720, which is incorporated
    by reference and not available. The hubs have only ever operated in this
    low-thrust engine and have had no AUSI, so (g)(2) and (g)(4) cannot be
    reached from these facts; whether (g)(1) or (g)(5) binds depends wholly on
    the bulletin tables.
