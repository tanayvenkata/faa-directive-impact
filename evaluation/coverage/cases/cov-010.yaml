schema_version: "1.1.0"
case_id: cov-010
title: Disk serial listed in AD 2021-11-51 installed on a D5 engine the AD does not name
slice: unaffected_part
severity: high
label:
  provenance: deterministic
  status: draft
  labeled_by: claude-draft
  labeled_on: "2026-10-15"
  rationale: >-
    Paragraph (c) of AD 2021-11-51 names seven models: V2522-A5, V2524-A5,
    V2527-A5, V2527E-A5, V2527M-A5, V2530-A5 and V2533-A5. It omits both D5
    models and V2531-E5, unlike most V2500 HPT ADs. A V2528-D5 is outside the
    AD even with a disk whose S/N is listed in (c)(1). V2528-D5 is within
    the project's supported V2500-A5/D5/E5 scope, so this is a directive
    determination, not a scope exclusion.
source_snapshot:
  generation_id: gen-20261015T175844Z-57440372
  as_of: "2021-07-25"
asset_snapshot:
  synthetic: true
  engine:
    asset_id: SYN-ENG-c010
    engine_serial_number: SYN-V2500-c010
    engine_model: V2528-D5
    snapshot_at: "2021-07-25"
  installed_components:
    - component_name: HPT 1st-stage disk
      part_number: 2A5001
      serial_number: PKLBR34908
    - component_name: HPT 2nd-stage disk
      part_number: 2A4802
      serial_number: SYN-DISK2-c010
  events: []
directive_candidates: ["2021-14268"]
expected:
  - directive: "2021-14268"
    controlling_ad: AD 2021-11-51
    authority_state: in_force
    applicability: does_not_apply
    reason: >-
      V2528-D5 is not among the models in paragraph (c), so AD 2021-11-51 does
      not reach this engine, although disk P/N 2A5001 S/N PKLBR34908 is listed
      in (c)(1).
    required_evidence:
      - {document: "2021-14268", paragraph: "(c)"}
forbidden_claims:
  - AD 2021-11-51 requires a USI of disk PKLBR34908 on this engine.
  - The engine is outside the supported V2500 scope.
  - The engine is compliant or noncompliant with AD 2021-11-51.
  - The engine is airworthy or safe to operate.
  - The engine is approved for return to service.
notes: >-
  PKLBR34908 is a real S/N published in the AD, placed on a synthetic engine; a
  records clerk would treat that as an anomaly to check. Other HPT disk ADs
  (for example AD 2021-14-19 or AD 2022-02-09) are not candidates here.
