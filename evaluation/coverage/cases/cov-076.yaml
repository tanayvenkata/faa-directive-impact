title: Complied ALS record contradicted by the stated maintenance program revision
slice: operator_assertion
severity: critical
label:
  provenance: deterministic
  status: draft
  labeled_by: claude-draft
  labeled_on: "2026-10-15"
  rationale: >-
    The pre-registered Operator Records rule: a record never overrides facts
    that contradict it. Here the contradicting fact is the program state, not
    an installed part: the stated current program and ALS do not incorporate
    table 1, so the paragraph (g) revisions are open whatever the record says.
    This extends seed-028's principle from installed parts to program state.
