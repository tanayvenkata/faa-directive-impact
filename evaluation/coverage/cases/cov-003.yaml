title: AUSI recorded as complied under AD 2024-11-03 starts the 4,000 FC removal clock
slice: operator_assertion
severity: critical
label:
  provenance: deterministic
  status: draft
  labeled_by: claude-draft
  labeled_on: "2026-10-15"
  rationale: >-
    The engine record shows both hubs received the paragraph (g)(1) AUSI on
    2024-09-12 and were reinstalled. Paragraph (g)(2) is not keyed to any
    bulletin list: every part inspected under (g)(1) must be removed within
    4,000 FC from the AUSI or at the next HPT module removal after it,
    whichever occurs first. The operator's "complied" entry covers the AUSI
    only; it does not close (g)(2). Counter at the AUSI 22,400 + 4,000 =
    26,400 ("within" includes the limit). No HPT module removal has occurred
    since.
