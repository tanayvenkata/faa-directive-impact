schema_version: "1.1.0"
case_id: cov-007
title: HPT disks of other part numbers under AD 2022-02-09
slice: unaffected_part
severity: high
label:
  provenance: deterministic
  status: draft
  labeled_by: claude-draft
  labeled_on: "2026-10-15"
  rationale: >-
    Paragraph (c) of AD 2022-02-09 includes the part condition: an installed
    HPT 1st-stage disk P/N 2A5001 or HPT 2nd-stage disk P/N 2A4802 with a
    listed S/N. Neither part number is installed, so the engine is outside the
    AD whatever the bulletin lists contain. The AD has no installation
    prohibition that would keep binding. For AD 2022-02-09 a different part
    number is the only way the public text can place a listed-model engine
    outside the AD, because every affected S/N is held in an unavailable
    bulletin; a determinate "no action triggered" outcome is not reachable
    from the text for any engine with P/N 2A5001 or 2A4802 installed.
