      - {document: "2024-12594", paragraph: "(c)"}
      - {document: "2024-12594", paragraph: "(g)(1)", locator: Table 1 to paragraph (g)(1) rows naming PW SI No. 189F-23}
      - {document: "2024-12594", paragraph: "(h)(3)", locator: high-thrust model definition}
      - {document: "2024-12594", paragraph: "(l)(2)(ii)", locator: PW SI No. 189F-23}
    required_missing_facts:
      - IAE AG NMSB V2500-ENG-72-0720 Tables 1 to 4 (unavailable incorporated material)
      - PW SI No. 189F-23 Tables 1 and 2 (unavailable incorporated material)
    action_timing:
      description: >-
        If a hub is listed in Table 1 or 2 of either document: AUSI at the next
        engine shop visit after 2024-06-26, before exceeding 100 FC (1st-stage)
        or 800 FC (2nd-stage) from 2024-06-26, because V2531-E5 is a high-thrust
        model under (h)(3). 40 FC have passed (9,040 - 9,000).
      safe_behavior: >-
        Name both unavailable documents and give the high-thrust compliance
        times conditionally.
forbidden_claims:
  - AD 2024-11-03 does not apply to V2531-E5 engines.
  - Only IAE AG NMSB V2500-ENG-72-0720 needs to be checked for this engine.
  - The 700 FC or 1,100 FC low-thrust limits apply to these hubs.
  - The engine is compliant or noncompliant with AD 2024-11-03.
  - The engine is airworthy or safe to operate.
  - The engine is approved for return to service.
notes: >-
  The preamble response to JetBlue records that PW SI No. 189F-23 relates to a
  military program and is provided only to those owning or operating the
  product.
