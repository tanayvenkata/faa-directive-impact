expected:
  - directive: "2024-12594"
    controlling_ad: AD 2024-11-03
    authority_state: in_force
    applicability: applies
    action_status: needs_review
    reason: >-
      V2531-E5 is listed in paragraph (c). The affected hub S/Ns for this
      model may be listed in IAE AG NMSB V2500-ENG-72-0720 or in PW SI No.
      189F-23 (Tables 1 to 4 to paragraphs (g)(1), (g)(4) and (g)(5)); neither
      is available, so no hub can be matched or cleared.
