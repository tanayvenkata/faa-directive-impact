  status: draft
  labeled_by: claude-draft
  labeled_on: "2026-10-15"
  rationale: >-
    V2531-E5 is listed in paragraph (c). For this model the tables name a
    second source of affected S/Ns, PW SI No. 189F-23, which the preamble says
    IAE provides only to owners and operators of the product. Both it and NMSB
    V2500-ENG-72-0720 are unavailable, so neither list can be checked. The
    engine is a high-thrust model under (h)(3), so the shorter limits would
    govern any listed hub.
