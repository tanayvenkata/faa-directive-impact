schema_version: "1.1.0"
case_id: cov-025
title: Asked after AD 2016-18-10 was published but before it took effect
slice: effective_date
severity: high
label:
  provenance: deterministic
  status: draft
  labeled_by: claude-draft
  labeled_on: "2026-10-15"
  rationale: >-
    AD 2016-18-10 was published 2016-09-02 and is effective 2016-10-07. On
    2016-09-20 it requires nothing yet, and its CSN bands are measured on the
    effective date, so they cannot be applied either. Applicability also
    depends on the unavailable hub S/N lists, so it stays unknown and the
    outcome stays in review rather than settled either way.
