schema_version: "1.1.0"
case_id: cov-024
title: Complied AD 2016-18-10 record where the affected-hub list is unavailable
slice: operator_assertion
severity: high
label:
  provenance: deterministic
  status: draft
  labeled_by: claude-draft
  labeled_on: "2026-10-15"
  rationale: >-
    The pre-registered Operator Records rule reports a complied record for a
    passed deadline as no action triggered, but only against facts that make
    the directive apply. Here applicability itself is unknown: it depends on
    the hub S/N lists in IAE NMSB V2500-ENG-72-0661 Revision 2, which is
    unavailable. A recorded status never settles applicability (gate 1), so
    the case stays in review and names the bulletin, not the record. The
    deadline has passed: a qualifying shop visit occurred on 2017-05-02,
    after the 2016-10-07 effective date.
