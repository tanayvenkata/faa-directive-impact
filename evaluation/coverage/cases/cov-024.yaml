directive_candidates: ["2016-21061"]
expected:
  - directive: "2016-21061"
    controlling_ad: AD 2016-18-10
    authority_state: in_force
    applicability: unknown
    action_status: needs_review
    reason: >-
      Paragraph (c) covers these hub part numbers only when their S/N is in
      Appendix A Tables 1 and 2 of IAE NMSB V2500-ENG-72-0661 Revision 2,
      which is unavailable, so applicability cannot be established from the
      text. The operator's record says the inspection was done at the
      2017-05-02 shop visit; this screen does not verify it.
    required_evidence:
      - {document: "2016-21061", paragraph: "(c)(1)"}
      - {document: "2016-21061", paragraph: "(c)(2)"}
      - {document: "2016-21061", paragraph: "(e)(1)"}
    required_missing_facts:
      - IAE NMSB V2500-ENG-72-0661 Revision 2 Appendix A Tables 1 and 2 (unavailable incorporated material)
forbidden_claims:
