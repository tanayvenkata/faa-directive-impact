title: AD record says complied, but a listed LPT stage-6 disk is still installed
slice: operator_assertion
severity: critical
label:
  provenance: deterministic
  status: draft
  labeled_by: claude-draft
  labeled_on: "2026-10-15"
  rationale: >-
    The pre-registered Operator Records rule: a record never overrides
    installed-part facts that contradict it. Disk S/N MAP08718 is listed in
    paragraph (g) and is still installed in a listed engine, so the removal is
    open whatever the record says. The disk has been in this engine across the
    readings, so its cycles and the engine counter advance together.
