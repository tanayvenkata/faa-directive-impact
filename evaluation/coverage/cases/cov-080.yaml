case_id: cov-080
title: 3rd-stage HPC blades modified to P/N 6A8688-001
slice: part_identity
severity: high
label:
  provenance: deterministic
  status: draft
  labeled_by: claude-draft
  labeled_on: "2026-10-15"
  rationale: >-
    Paragraph (c) names P/N 6A8353 and 6A8688. Paragraph (h)(1)(ii) makes a
    blade "modified to P/N 6A8353-001 or P/N 6A8688-001" a part eligible for
    installation. P/N 6A8688-001 is a different part number from 6A8688, so
    the exact-P/N rule of gate 9 gives does_not_apply. A prefix match would
    wrongly bring the engine in.
