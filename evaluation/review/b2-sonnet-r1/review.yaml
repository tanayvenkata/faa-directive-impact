  model_said:
    seed-019:
      summary: The AD is in force and the engine model is covered. The installed HPT 1st-stage hub 2A5001
        S/N PKLBSS9200 matches table 1 (limit 4,800 cycles since new) and is already past that limit.
        Removal is due at the next engine shop visit, and no later than 100 flight cycles after the effective
        date only if that is the later of the two conditions.
      timing: 'Paragraph (g) requires removal at the next engine shop visit after 2025-10-29, before exceeding
        the removal cycle limit or within 100 flight cycles after the effective date, whichever occurs
        later. The limit was already exceeded, so the 100-cycle point (engine flight cycles 60100) is
        the later one. No shop visit is recorded yet. The text can be read two ways: the 100-cycle point
        may be a hard deadline, or removal may wait for the next shop visit. Under the first reading,
        the engine must not fly past 60100 cycles without a shop visit.'
  expected:
    seed-019: Remove within 100 FC after 2025-10-29, by engine counter 60,100 (60 FC after this snapshot).
      The hub is 190 cycles past its listed limit.
  forbidden_claims:
    seed-019:
    - The engine must be grounded immediately under AD 2025-19-13.
    - The hub may remain installed beyond 100 FC after the effective date.
    - The engine is compliant or noncompliant.
  my_verdict: present / contradicts (borderline)
  my_reason: 'Presents "removal may wait for the next shop visit" as one of two readings, which implies
    the hub may remain installed beyond 100 FC after the effective date (forbidden). BORDERLINE: it is
    offered as a reading, not a conclusion. Timing: Leaves the 60,100 hard deadline as one of two readings.
    Expected: remove by 60,100. BORDERLINE: it does state 60,100.'
  your_verdict: ''
