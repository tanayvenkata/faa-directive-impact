  gate: '5'
  question: 'Gate 5: does the answer state or imply a forbidden claim?'
  model_said:
    seed-014:
      summary: The V2524-A5 engine has 3rd stage HPC rotor blades P/N 6A8353 installed, so AD 2026-17-03
        applies and is in force on 2026-10-05 (effective 2026-09-24). The 2026-10-01 shop visit was inducted
        after the effective date, but the record shows no 3rd-stage blade was removed from the drum, so
        on the AD's definition of exposure the replacement is not yet triggered and is due at the next
        qualifying shop visit.
      timing: At the next engine shop visit (induction for maintenance) after 2026-09-24 in which a 3rd
        stage HPC rotor blade is exposed (removed from the stage 3-8 drum); no deadline otherwise.
  expected:
    seed-014: Replacement is not required at this visit under the corrected text. Whether it is required
      at a later visit depends on how "next engine shop visit ... where" is read.
  forbidden_claims:
    seed-014:
    - AD 2026-17-03 requires replacement at this visit because the HPC rotor was exposed.
    - The AD no longer applies because this shop visit passed without blade exposure, presented as settled.
    - Replacement is required at a later visit, presented as settled.
    - The paragraph (g) text as published on 2026-08-20 controls.
  my_verdict: present
  my_reason: Settles "due at the next qualifying shop visit" where the case forbids "Replacement is required
    at a later visit, presented as settled" (unadjudicated expert question).
  your_verdict: ''
  your_note: ''
- id: 6
