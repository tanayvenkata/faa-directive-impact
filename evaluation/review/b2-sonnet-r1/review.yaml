  gate: '11'
  question: 'Gate 11: does the stated timing contradict the expected timing (wrong trigger, limit, or
    date)? All eight share one reading: removal happens only at a shop visit, so with no shop visit there
    is no deadline.'
  model_said:
    seed-006: At the next engine shop visit after 2025-10-29, but not before the later of reaching the
      100 cycles-since-new limit or 100 flight cycles after the effective date. 'Whichever occurs later'
      means the deadline is the later of the two; here that is 100 flight cycles after the effective date
      (engine cycle 25,600). No shop visit is recorded, so no deadline has been triggered by an event.
    seed-007: At the next engine shop visit after 2025-10-29, at or after the later of reaching the removal
      cycle limit (4,800 CSN for the 1st-stage hub; 4,000 CSN for the 2nd-stage hub) or 100 flight cycles
      after the effective date (engine counter 30,100). No deadline applies unless a shop visit occurs.
      Replacement parts must not be Table 1 parts.
    seed-008: At the next engine shop visit after 2025-10-29, at or after the later of reaching the 6,200
      cycles-since-new limit or 100 flight cycles after the effective date. The later-of reading puts
      the 1st-stage hub removal at the first shop visit once the hub has passed 6,200 cycles since new;
      no shop visit is recorded yet.
    seed-018: 'Not yet effective (effective 2025-10-29). Once effective, remove and replace the hub at
      the next engine shop visit after 2025-10-29 that occurs at or after the later of: the hub exceeding
      its 6,000 cycles-since-new removal limit, or 100 flight cycles after the effective date. No deadline
      applies absent such a shop visit.'
    seed-023/2025-18469: At the next engine shop visit after 2025-10-29, before exceeding the 6,000 cycles-since-new
      limit or within 100 flight cycles after the effective date, whichever occurs later. No shop visit
      is recorded, so no fixed calendar deadline can be computed.
    seed-026: At the next engine shop visit after October 29, 2025, at the later of reaching the 6,200
      cycles-since-new removal limit or 100 flight cycles after the effective date. Because the shop-visit
      trigger is a future event, no date is fixed. The 100-flight-cycle point after the effective date
      is engine counter 20,100, already passed. The hub reaches 6,200 cycles at about engine counter 23,200
      on the 2026-03-01 reading.
    seed-027: At the next engine shop visit after 2025-10-29, before exceeding 4,800 CSN or within 100
      flight cycles after the effective date, whichever occurs later. The 100-cycle window after the effective
      date has already passed (engine cycles 15,000 to 15,100). Because the hub is now at 4,750 CSN, the
      4,800 CSN limit has not been reached. No shop visit is recorded, so the action is event-driven and
      no fixed deadline can be computed.
    seed-028: At the next engine shop visit after 2025-10-29, before exceeding the 4,000 cycles-since-new
      limit or within 100 flight cycles after the effective date, whichever occurs later. No qualifying
      shop visit is recorded, so action is due when one occurs. Because the hub is only at 1,400 cycles,
      the 'whichever occurs later' wording means the later date is controlling.
  expected:
    seed-006: Latest removal is 100 FC after 2025-10-29 (engine counter 25,600), which is 70 FC after
      this snapshot. The 100 CSN limit comes earlier but is superseded by "whichever occurs later". This
      holds only if no qualifying shop visit occurs first; if one does, see seed-005.
    seed-007: 'The 1st-stage hub is due first: at the next qualifying shop visit, no later than engine
      counter 30,800 (500 hub cycles remaining). The 2nd-stage hub is due by counter 32,000 (1,700 remaining).
      Both require removal.'
    seed-008: The 1st-stage hub is due at the next qualifying shop visit, no later than engine counter
      54,200 (3,700 hub cycles remaining). The 2nd-stage hub's status is unknown until its S/N is supplied.
    seed-018: Nothing is required yet. From 2025-10-29 the hub must be removed before 6,000 CSN. Per adjudication
      faa-informal-2026-10-05, a shop visit within the first 100 FC does not force earlier removal. Whether
      a later qualifying shop visit does is pending.
    seed-023/2025-18469: Remove at the next qualifying shop visit, no later than engine counter 25,000
      (2,500 hub cycles remaining).
    seed-026: Remove at the next qualifying engine shop visit, no later than engine counter 23,200, when
      the hub reaches 6,200 CSN (2,600 cycles remaining).
    seed-027: Remove at the next qualifying engine shop visit, no later than engine counter 15,300, when
      the hub reaches 4,800 CSN (50 cycles remaining). A verified, approved AMOC could change this.
    seed-028: Remove at the next qualifying engine shop visit, no later than engine counter 11,000, when
      the hub reaches 4,000 CSN (2,600 cycles remaining).
  my_verdict: contradicts (all eight)
  my_reason: The expected answers, and the FAA engineer's stated intent, put a hard latest point on removal
    (the hub's limit, or 100 FC after the effective date if later). Under the model's reading a listed
    hub could keep flying past its limit until some future shop visit.
  your_verdict: ''
  your_note: ''
