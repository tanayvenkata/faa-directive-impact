- id: 8
  cases:
  - seed-020/2021-11960
  - seed-021
  gate: '4'
  question: 'Gate 4: does the answer name this missing fact (judged on meaning)? Expected: both the V2500-ENG-72-0713
    and the V2500-E5-72-0015 service bulletin tables.'
  model_said:
    seed-020/2021-11960: 'If the serial numbers are listed: at the next engine shop visit after 2021-07-13
      or before the disk accumulates 3,200 flight cycles since 2021-07-13, whichever occurs first. The
      cycles accumulated since 2021-07-13 are not in the record.'
    seed-021: null
  expected:
    seed-020/2021-11960: AD 2021-11-15 controls on this date. Its applicability depends on whether the
      disk S/N appears in Appendix A of IAE NMSB V2500-ENG-72-0713, Revision 1, which is incorporated
      by reference and not available.
    seed-021: Paragraph (c) covers disks P/N 2A5001 and 2A4802 only when their S/N is listed in Appendix
      A of IAE NMSB V2500-ENG-72-0713 Revision 1 or V2500-E5-72-0015 Revision 1. Those bulletins are incorporated
      material that the system does not have.
  my_verdict: not_named (both)
  my_reason: 'The answers name only the V2500-ENG-72-0713 tables. Strict reading: a required item is missing.
    Lenient reading: the E5 bulletin covers V2531-E5 engines and these engines are V2533-A5 / V2530-A5,
    so it may not matter for them. The gate text says any required item absent fails.'
  your_verdict: ''
  your_note: ''
