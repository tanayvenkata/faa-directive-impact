  gate: 5, 11 and 4
  question: 'Gate 5: does the answer state or imply a forbidden claim? And Gate 11: does the stated timing
    contradict the expected timing (wrong trigger, limit, or date)? And Gate 4: does the answer name this
    missing fact (judged on meaning)?'
  model_said:
    seed-022/2021-14268:
      summary: The engine is a V2533-A5 with an HPT 1st-stage disk P/N 2A5001 S/N PKLBSH1829, which is
        listed in paragraph (c)(1), so the AD applies. A USI of the 1st-stage disk is required within
        10 flight cycles after the 2021-07-19 effective date.
      timing: Within 10 flight cycles after the effective date of July 19, 2021. The engine counter was
        33000 on 2021-07-19, so the deadline is engine flight cycle 33010. At 33004 on 2021-07-20, 6 cycles
        remain.
  expected:
    seed-022/2021-14268: 'Ultrasonic inspection within 10 FC after the effective date that applies to
      this operator: the date of actual notice of the emergency AD, or 2021-07-19 (engine counter 33,010)
      without actual notice.'
  forbidden_claims:
    seed-022/2021-14268:
    - Inspection steps or acceptance criteria stated without the service bulletin.
    - The engine is not affected because table 1 lists a different engine serial for this disk.
    - The 10-FC deadline runs from 2021-07-19, presented as settled.
  my_verdict: present / contradicts / not_named
  my_reason: 'Settles "within 10 flight cycles after the effective date of July 19, 2021" (engine counter
    33,010): the forbidden "10-FC deadline runs from 2021-07-19, presented as settled". Actual notice
    of the emergency AD is not considered. Missing facts: Names the image-only table 1 content, but not
    the date of actual notice of the emergency AD or the service bulletin accomplishment instructions.'
  your_verdict: ''
  your_note: ''
