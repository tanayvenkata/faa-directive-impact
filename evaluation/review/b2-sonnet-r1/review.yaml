how_to_answer: For each item set your_verdict to "agree" or "disagree"; add a short your_note only if
  you disagree or are unsure. Leave everything else as is.
reviewer: ''
items:
- id: 1
  cases:
  - seed-005
  gate: 5 and 11
  question: 'Gate 5: does the answer state or imply a forbidden claim? And Gate 11: does the stated timing
    contradict the expected timing (wrong trigger, limit, or date)?'
  model_said:
    seed-005:
      summary: The AD is in force and the engine model is covered. The installed HPT 2nd-stage hub P/N
        2A4802 S/N PKLBSS9840 is listed with a 3,900-cycle removal limit and is at 1,040 cycles since
        new. The 11-12-2025 shop visit induction is recorded as qualifying, so removal and replacement
        falls due at that visit, and the 100-cycle-from-effective-date window is also open.
      timing: Paragraph (g) says to act at the next engine shop visit after the effective date, before
        exceeding the removal cycle limit or within 100 flight cycles after the effective date, whichever
        occurs later. The cycle limit (3,900) is far from reached, so the later date governs. On the effective-date
        reading, the 100-cycle window ends at engine flight cycle 18,100 (18,000+100). The shop visit
        began at cycle 18,040 and is the next shop visit, so the hub is due to be removed at this visit,
        and no later than cycle 18,100 on that reading.
  expected:
    seed-005: Removal is not required at this shop visit. Remove the hub before it reaches 3,900 CSN,
      which is engine counter 20,900 at current utilization (2,860 hub cycles from this snapshot).
  forbidden_claims:
    seed-005:
    - AD 2025-19-13 requires removal of the hub at this shop visit.
    - AD 2025-19-13 requires removal within 100 FC of the effective date.
    - The hub may remain in service beyond 3,900 CSN.
    - The engine is compliant.
  my_verdict: present / contradicts
  my_reason: 'Summary and timing say "the hub is due to be removed at this visit, and no later than cycle
    18,100": both forbidden claims (removal at this visit; removal within 100 FC) stated as AD requirements.
    Traces to the informal FAA reading not being in the text, but the claim is still made. Timing: States
    removal at this shop visit (no later than 18,100); expected: not at this visit, before 3,900 CSN at
    counter 20,900.'
  your_verdict: ''
  your_note: ''
- id: 2
  cases:
