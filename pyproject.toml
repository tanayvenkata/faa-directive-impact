[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "faa-directive-impact"
version = "0.1.0"
description = "Evidence-backed FAA directive acquisition and impact analysis"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Tanay Venkata" }]
dependencies = [
  "defusedxml>=0.7,<1",
  "httpx>=0.28,<1",
  "jsonschema[format]>=4.23,<5",
  "pypdf>=5,<7",
]

[project.scripts]
faa-directive-impact = "faa_directive_impact.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
  "types-defusedxml>=0.7.0.20260504",
]

[tool.hatch.build.targets.wheel]
packages = ["src/faa_directive_impact"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
